<section
    class="section contact-section"
    id="contact"
    aria-label="Contact Abeer Velugoti">

    <div class="container">

        <div class="contact-inner">

            <div class="contact-blob"></div>

            <div class="contact-content reveal">

                <p class="section-label">
                    Contact
                </p>

                <h2 class="contact-title">
                    Let's build something<br>
                    <span class="text-gradient">meaningful.</span>
                </h2>

                <p class="contact-sub">
                    I'm open to opportunities where I can contribute to backend systems,
                    scalable applications, and challenging engineering problems.
                    Feel free to reach out.
                </p>


                <div class="contact-actions">

                    <!-- EMAIL -->

                    <button
                        type="button"
                        class="contact-btn primary-btn"
                        (click)="openEmail()"
                        aria-label="Send email">

                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5">

                            <path
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />

                        </svg>

                        <span>Email Me</span>

                        <span class="contact-email">
                            vabeer000&#64;gmail.com
                        </span>

                    </button>


                    <!-- LINKEDIN -->

                    <button
                        type="button"
                        class="contact-btn glass-btn"
                        (click)="openLinkedIn()"
                        aria-label="Open LinkedIn profile">

                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5">

                            <path
                                d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z" />

                            <circle
                                cx="4"
                                cy="4"
                                r="2" />

                        </svg>

                        <span>LinkedIn</span>

                    </button>


                    <!-- GITHUB -->

                    <button
                        type="button"
                        class="contact-btn glass-btn"
                        (click)="openGitHub()"
                        aria-label="Open GitHub profile">

                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="currentColor">

                            <path
                                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />

                        </svg>

                        <span>GitHub</span>

                    </button>

                </div>


                <div class="contact-detail">

                    <span
                        class="mono"
                        style="font-size:0.78rem;color:var(--text-tertiary)">
                        +91 7993764508
                    </span>

                    <span class="divider-dot">
                        ·
                    </span>

                    <span
                        class="mono"
                        style="font-size:0.78rem;color:var(--text-tertiary)">
                        Hyderabad, India
                    </span>

                </div>

            </div>

        </div>

    </div>
</section>
