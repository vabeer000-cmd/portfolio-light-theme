<footer class="footer" role="contentinfo">

    <div class="container">

        <div class="footer-top">

            <!-- BRAND -->

            <div class="footer-brand">

                <a
                    class="footer-logo"
                    href="#hero"
                    aria-label="Back to top"
                    (click)="scrollToTop($event)">

                    <span class="logo-bracket">[</span>
                    ABEER
                    <span class="logo-bracket">]</span>

                </a>

                <p class="footer-title">
                    Java Full Stack Developer
                </p>

                <p class="footer-stack mono">
                    Java · Spring Boot · REST · MySQL · Angular · Flutter
                </p>

            </div>


            <!-- LINKS -->

            <div class="footer-links">

                <!-- EMAIL -->

                <button
                    type="button"
                    class="footer-link footer-button"
                    aria-label="Send email"
                    (click)="openEmail()">

                    Email

                </button>


                <!-- LINKEDIN -->

                <button
                    type="button"
                    class="footer-link footer-button"
                    aria-label="Open LinkedIn profile"
                    (click)="openLinkedIn()">

                    LinkedIn

                </button>


                <!-- GITHUB -->

                <button
                    type="button"
                    class="footer-link footer-button"
                    aria-label="Open GitHub profile"
                    (click)="openGitHub()">

                    GitHub

                </button>

            </div>

        </div>


        <div class="footer-divider"></div>


        <div class="footer-bottom">

            <p class="footer-copy">
                © 2026 Abeer Velugoti · Hyderabad, India
            </p>

            <p class="footer-built mono">
                Built with Angular
            </p>

        </div>

    </div>

</footer>
